    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=&apos;http://www.w3.org/2000/svg&apos; viewBox=&apos;0 0 30 28&apos;%3E%3Crect x=&apos;6.5&apos; y=&apos;0.5&apos; width=&apos;23&apos; height=&apos;23&apos; rx=&apos;7.4&apos; fill=&apos;%232A2340&apos; transform=&apos;rotate(-9 18 12)&apos;/%3E%3Crect x=&apos;0.5&apos; y=&apos;4&apos; width=&apos;23&apos; height=&apos;23&apos; rx=&apos;7.4&apos; fill=&apos;%238B5CF6&apos;/%3E%3Ccircle cx=&apos;8.3&apos; cy=&apos;15.5&apos; r=&apos;1.9&apos; fill=&apos;%230A0910&apos;/%3E%3Ccircle cx=&apos;15.7&apos; cy=&apos;15.5&apos; r=&apos;1.9&apos; fill=&apos;%230A0910&apos;/%3E%3C/svg%3E">
    <script>
    /* Runs before the first byte of body is parsed, which is the whole point:
       everything below reads document.documentElement, and a mode or a theme
       applied after first paint is a flash the reader sees.

       Deliberately inline rather than in js/. A script at the foot of the body
       is by definition too late to prevent a flash, and these few lines are not
       worth a blocking request of their own. */
    (function () {
        try {
            var theme = localStorage.getItem('theme');
            if (theme === 'dark' || theme === 'light') {
                document.documentElement.setAttribute('data-theme', theme);
            }

            var mode = localStorage.getItem('droiddeck:mode');
            if (mode) document.documentElement.dataset.mode = mode;

            // Only when there is no hash to honour. A shared link always wins
            // over where this browser happened to be last.
            if (!location.hash && mode) {
                var last = JSON.parse(localStorage.getItem('droiddeck:mode:last') || '{}');
                location.replace(last[mode] || ('#' + mode));
            }
        } catch (e) {
            /* Private mode, file://, a hand-edited value: the defaults are fine. */
        }
    })();
    </script>

            <!-- A deck of cards with a face on the top card. Two dots, two
                 rounded squares — it reads at 16px in a browser tab, which
                 the emoji mascot it replaced did not. -->
            <svg class="brand-mark" width="30" height="28" viewBox="0 0 30 28" fill="none" aria-hidden="true" focusable="false">

        <!-- Five items and one divider, all built from data/modes.js. -->
        <div class="rail-items" id="railItems"></div>

        <div class="rail-spacer"></div>

        <!-- Per mode, never a total across the five: they count five different
             things and a combined number would be true of none of them. -->
        <div class="rail-meter" id="railMeter" aria-hidden="true">
            <div class="rail-meter-fill" id="railMeterFill"></div>
        </div>
        <div class="rail-meter-label" id="railMeterLabel"></div>

        <!-- Two explicit states rather than one button whose icon you have to
             decode. A radiogroup, because the choice is exclusive and the
             reader should be able to see which one is current. -->
        <div class="theme-switch" id="themeSwitch" role="radiogroup" aria-label="Colour theme">
            <button type="button" class="theme-switch-option" data-theme-value="dark" role="radio" aria-checked="true" title="Dark">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">

                <span>Dark</span>
            </button>
            <button type="button" class="theme-switch-option" data-theme-value="light" role="radio" aria-checked="false" title="Light">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="12" cy="12" r="4.2"/>
                    <path d="M12 2.6v2.2M12 19.2v2.2M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.4 19.6 6 18M18 6l1.6-1.6"/>
                </svg>
                <span>Light</span>
            </button>
